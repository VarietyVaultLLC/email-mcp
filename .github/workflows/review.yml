# Claude reviews every pull request with Anthropic's code-review plugin, using
# the review workflow from Anthropic's docs as shipped:
# https://code.claude.com/docs/en/github-actions ("Run a skill").
# Claude posts as the Claude GitHub app: an inline comment on each issue it
# finds, or one summary comment when it finds none. It skips drafts, closed
# pull requests, and pull requests it has already commented on.
#
# Decision: claude-lead decisions file, entry 13, 2026-11-06 (go back to the
# stock workflow). Only these changes from the docs' example:
# - Login: our CLAUDE_CODE_OAUTH_TOKEN org secret instead of an API key, as
#   the docs say to do for a subscription token.
# - Pinned: both actions by commit SHA, and the plugin by commit (the step
#   below). The action only accepts marketplace URLs that end in .git, and a
#   marketplace ref can't be a commit, so a small local marketplace lists the
#   one plugin at that commit. Its name can't be claude-plugins-official,
#   which Claude Code reserves for Anthropic's own repository.
# - Credential scrub: commands Claude runs get no Claude login and no Actions
#   or cloud secrets. It needs bubblewrap, which the action installs only for
#   non-write users, so the job installs it with the action's own commands.
# - Background tasks off: otherwise the plugin's agents start in the
#   background and the run ends before anything is posted.
# - A 30-minute limit and one run at a time per pull request (the docs'
#   cost advice: workflow timeouts and concurrency controls).
# - The Claude app token is asked for with contents read only. The action
#   merges additional_permissions over its default of contents, pull requests
#   and issues write, so the token can comment but can't push code.
# - Pushes by the @claude fixer (claude[bot]) skip the job. The action refuses
#   runs started by a bot and would fail the check, and the plugin skips a
#   pull request it has already commented on anyway. A skipped job counts as
#   passing for required checks.
name: Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  # Keep the id "review": rulesets require a check with that name.
  review:
    if: github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      # anthropics/claude-plugins-official d189be9 holds code-review 1.0.1.
      # To take an upstream change, read it, then update the sha.
      - name: Pin the code-review plugin
        run: |
          mkdir -p "$RUNNER_TEMP/review-marketplace/.claude-plugin"
          cat > "$RUNNER_TEMP/review-marketplace/.claude-plugin/marketplace.json" <<'JSON'
          {
            "name": "review-pinned",
            "owner": {"name": "review.yml"},
            "plugins": [{
              "name": "code-review",
              "source": {
                "source": "git-subdir",
                "url": "https://github.com/anthropics/claude-plugins-official.git",
                "path": "plugins/code-review",
                "sha": "d189be9fc7a63d53d4e2af59accdd70e933e41e9"
              }
            }]
          }
          JSON
      - name: Install bubblewrap for the credential scrub
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            contents: read
          plugin_marketplaces: ${{ runner.temp }}/review-marketplace
          plugins: "code-review@review-pinned"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
