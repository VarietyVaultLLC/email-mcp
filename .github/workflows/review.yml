# Claude reviews every pull request with Anthropic's official code-review
# plugin, wired the way Anthropic's GitHub Actions docs ship it
# (https://code.claude.com/docs/en/github-actions.md, "Run a skill").
# Same wiring as Segue's review.yml. Segue issue #291 and Segue ADR 0004 record
# the decision and what it gives up. Jon picked the plugin, its default models
# and the as-shipped wiring for both repos on 2026-11-05.
#
# As shipped, on purpose:
# - Two Opus agents look for bugs and two Sonnet agents check CLAUDE.md. Each
#   finding is checked again by its own agent, and only confirmed findings are
#   posted, as inline comments, or as one "No issues found" comment. The
#   ruleset requires every review thread resolved, so each finding gets an
#   answer before merge.
# - It reviews a pull request once: the plugin skips a PR it has commented on.
# - It sets no pass/fail verdict. `review` is advice, not a required check.
# - The plugin is not pinned: each run installs the marketplace's current version.
# - A pull request that edits this file gets a green `review` that ran nothing:
#   the action runs only when this file matches main's copy, so a change here is
#   first exercised by the next pull request after it merges.
# Five departures from the docs' example: the login is our
# CLAUDE_CODE_OAUTH_TOKEN, not an API key; pull requests the cloud agent
# (claude.yml) opens are reviewed too (`allowed_bots`); actions are pinned by
# SHA, as everywhere in this repo; one review per PR runs at a time; and the
# reviewer is fenced (below), because the PR's own text can steer it.
name: review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
# Queue, never cancel: two quick pushes would otherwise both start before either
# has commented, and post the review twice. A cancelled run could also leave a
# partial review that makes the plugin skip the PR for good.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      # Commands Claude runs (the plugin's `gh` calls) get no Claude login and
      # no Actions or cloud secrets; `gh` keeps its GitHub token.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      # The plugin's agents would otherwise start in the background, and a
      # non-interactive session ends before they report: nothing gets posted.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          # No workflow token left in .git/config for the reviewer to read.
          persist-credentials: false
      # The env scrub needs bubblewrap, which the action installs only for
      # non-write users. These are its own install commands. If they fail, the
      # job fails and nothing is reviewed: closed, not open.
      - name: Install bubblewrap
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The fence (hold of 2026-11-05, Jon's "Hold all, agent-1 fixes"). The
          # action already restores .claude/, .mcp.json and CLAUDE.md from the
          # base branch on pull requests; on top of that: no project settings,
          # no MCP server but the action's own, no hooks, and no reads outside
          # the checkout or of .git, where the action writes its own token; and
          # `gh pr comment` (the plugin's one write) can't post a file or
          # expand a variable or command.
          # A pull request's text is data that can try to steer the reviewer
          # into reading a secret and posting it. Rules are comma-free: the
          # action splits these flags on commas.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment" "Skill(code-review:code-review)"
            --setting-sources user
            --strict-mcp-config
            --settings '{"disableAllHooks":true}'
            --disallowedTools "Bash(gh pr comment *--body-file*)" "Bash(gh pr comment *-F*)" 'Bash(gh pr comment *$*)' 'Bash(gh pr comment *`*)'
            --disallowedTools "Read(//proc/**)" "Read(//sys/**)" "Read(//dev/**)" "Read(//etc/**)" "Read(//root/**)" "Read(//var/**)" "Read(~/.*)" "Read(~/.*/**)" "Read(//home/runner/runners/**)" "Read(//home/runner/actions-runner/**)" "Read(/${{ runner.temp }}/**)" "Read(.git)" "Read(.git/**)" "Read(./.git/**)"
